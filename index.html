<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construtor de Casas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #87ceeb;
      overflow: hidden;
    }

    .ground {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 25vh;
      background: #4caf50;
    }

    .control-panel {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 25vw;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      gap: 12px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(2px);
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.3);
    }

    button {
      font-family: inherit;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
    }

    button:hover {
      transform: translateY(-3px);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(0) scale(0.96);
    }

    #btn-build {
      background: linear-gradient(135deg, #4caf50, #388e3c);
    }

    #btn-explode {
      background: linear-gradient(135deg, #f44336, #c62828);
    }

    #btn-melt {
      background: linear-gradient(135deg, #ff9800, #f57c00);
    }

    #btn-abduct {
      background: linear-gradient(135deg, #7c4dff, #512da8);
    }

    #btn-return {
      background: linear-gradient(135deg, #26c6da, #00838f);
    }

    .scene {
      position: fixed;
      bottom: 25vh;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 320px;
      z-index: 5;
    }

    .house {
      position: absolute;
      bottom: 0;
      left: 50%;
      margin-left: -90px;
      width: 180px;
      height: 150px;
      background: #f4a460;
      border: 3px solid #5d4037;
      visibility: hidden;
      opacity: 0;
    }

    .house.built {
      visibility: visible;
      opacity: 1;
    }

    .house.popping {
      animation: pop 0.4s ease-out;
    }

    .house.returning {
      visibility: visible;
      animation: return-down 1.6s ease-out forwards;
    }

    @keyframes return-down {
      from {
        transform: translateY(-45vh) scale(0.05);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    .house .roof {
      position: absolute;
      bottom: 100%;
      left: 50%;
      margin-left: -105px;
      width: 0;
      height: 0;
      border-left: 105px solid transparent;
      border-right: 105px solid transparent;
      border-bottom: 90px solid #c62828;
    }

    .house .door {
      position: absolute;
      bottom: 0;
      left: 50%;
      margin-left: -20px;
      width: 40px;
      height: 60px;
      background: #5d4037;
      border-radius: 20px 20px 0 0;
      z-index: 1;
    }

    .house .window {
      position: absolute;
      top: 20px;
      width: 34px;
      height: 34px;
      background: #bbdefb;
      border: 3px solid #5d4037;
      border-radius: 4px;
    }

    .house .window.left {
      left: 16px;
    }

    .house .window.right {
      right: 16px;
    }

    @keyframes pop {
      0% {
        transform: scale(0);
      }
      70% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }

    .house.melting {
      animation: melt 1.6s ease-in forwards;
    }

    @keyframes melt {
      0% {
        transform: scale(1);
        opacity: 1;
      }
      25% {
        transform: scaleY(1.1);
        border-radius: 12px 12px 0 0;
      }
      60% {
        transform: scaleY(0.55) translateY(30px);
        border-radius: 40% 40% 60% 60%;
        filter: blur(1px);
      }
      100% {
        transform: scaleY(0.05) translateY(70px);
        border-radius: 50%;
        opacity: 0;
      }
    }

    .drip {
      position: fixed;
      width: 10px;
      height: 30px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
      background: #f4a460;
      animation: drip 1.2s ease-in forwards;
    }

    @keyframes drip {
      from {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      to {
        transform: translateY(120px) scale(0.6);
        opacity: 0;
      }
    }

    .particle {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 20;
      animation: fly 0.9s ease-out forwards;
    }

    @keyframes fly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(0.2);
        opacity: 0;
      }
    }

    .boom {
      position: absolute;
      top: 40%;
      left: 50%;
      margin-left: -45px;
      font-size: 90px;
      opacity: 0;
      pointer-events: none;
      z-index: 15;
    }

    #ufo {
      position: fixed;
      top: 3%;
      left: -320px;
      width: 200px;
      height: 70px;
      z-index: 18;
      visibility: hidden;
      pointer-events: none;
    }

    #ufo .ufo-body {
      position: absolute;
      top: 0;
      left: 0;
      width: 200px;
      height: 70px;
      animation: bob 2.2s ease-in-out infinite alternate;
    }

    #ufo.enter {
      visibility: visible;
      animation: ufo-in 1.6s ease-in forwards;
    }

    #ufo.exit {
      visibility: visible;
      animation: ufo-out 1.5s ease-in forwards;
    }

    @keyframes ufo-in {
      from {
        left: -320px;
      }
      to {
        left: calc(50% - 100px);
      }
    }

    @keyframes ufo-out {
      from {
        left: calc(50% - 100px);
      }
      to {
        left: 100vw;
      }
    }

    .ufo-dome {
      position: absolute;
      top: -34px;
      left: 50%;
      transform: translateX(-50%);
      width: 84px;
      height: 56px;
      background: radial-gradient(circle at 35% 22%, #e8fbff, #4fc3f7 55%, #0277bd);
      border-radius: 50% 50% 48% 48%;
      box-shadow: inset 0 -8px 10px rgba(0, 0, 0, 0.3), 0 0 18px rgba(79, 195, 247, 0.6);
    }

    .ufo-dome::after {
      content: '';
      position: absolute;
      top: 8px;
      left: 20px;
      width: 12px;
      height: 8px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: rotate(-25deg);
    }

    .ufo-saucer {
      position: absolute;
      top: 20px;
      left: 0;
      width: 200px;
      height: 52px;
      background: radial-gradient(ellipse at 50% 0%, #cfd8dc, #90a4ae 55%, #455a64);
      border-radius: 50%;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.45);
    }

    .ufo-saucer::after {
      content: '';
      position: absolute;
      left: 17%;
      right: 17%;
      bottom: -20px;
      height: 30px;
      background: radial-gradient(ellipse at 50% 0%, #90a4ae, #37474f);
      border-radius: 50%;
      box-shadow: inherit;
    }

    .ufo-light {
      position: absolute;
      bottom: -4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      animation: blink 0.5s ease-in-out infinite alternate;
    }

    .ufo-light.l1 { left: 20px; background: #ff1744; }
    .ufo-light.l2 { left: 55px; background: #00e676; animation-delay: 0.15s; }
    .ufo-light.l3 { left: 95px; background: #2979ff; animation-delay: 0.3s; }
    .ufo-light.l4 { left: 130px; background: #ffee58; animation-delay: 0.45s; }
    .ufo-light.l5 { left: 165px; background: #ff9100; animation-delay: 0.6s; }

    @keyframes blink {
      from {
        opacity: 0.2;
        box-shadow: none;
      }
      to {
        opacity: 1;
        box-shadow: 0 0 10px 3px currentColor;
      }
    }

    @keyframes bob {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(14px);
      }
    }

    #beam {
      position: fixed;
      top: 13%;
      left: calc(50% - 70px);
      width: 140px;
      height: 45vh;
      clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
      background: linear-gradient(to bottom, rgba(139, 255, 139, 0.9), rgba(139, 255, 139, 0));
      z-index: 17;
      visibility: hidden;
      pointer-events: none;
    }

    #beam.show {
      visibility: visible;
      animation: beam-glow 0.8s ease-in-out infinite alternate;
    }

    @keyframes beam-glow {
      from {
        opacity: 0.5;
      }
      to {
        opacity: 1;
      }
    }

    .house.abducted {
      animation: abduct 1.5s ease-in forwards;
    }

    @keyframes abduct {
      to {
        transform: translateY(-45vh) scale(0.1);
        opacity: 0;
      }
    }

    .boom.show {
      animation: boom 0.8s ease-out forwards;
    }

    @keyframes boom {
      0% {
        opacity: 1;
        transform: scale(0.3);
      }
      100% {
        opacity: 0;
        transform: scale(2.5);
      }
    }

    .message {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 10px 24px;
      border-radius: 50px;
      font-size: 18px;
      z-index: 30;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .message.show {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="ground"></div>

  <div class="control-panel">
    <button id="btn-build" type="button" onclick="buildHouse()">Construir casa</button>
    <button id="btn-explode" type="button" onclick="explodeHouse()">Explodir casa</button>
    <button id="btn-melt" type="button" onclick="meltHouse()">Derreter casa</button>
    <button id="btn-abduct" type="button" onclick="abductHouse()">Abduzir casa</button>
    <button id="btn-return" type="button" onclick="returnHouse()">Devolver casa</button>
  </div>

  <div class="scene">
    <div id="ufo">
      <div class="ufo-body">
        <div class="ufo-dome"></div>
        <div class="ufo-saucer"></div>
        <div class="ufo-light l1"></div>
        <div class="ufo-light l2"></div>
        <div class="ufo-light l3"></div>
        <div class="ufo-light l4"></div>
        <div class="ufo-light l5"></div>
      </div>
    </div>
    <div id="beam" class="beam"></div>
    <div id="boom" class="boom">💥</div>
    <div id="house" class="house">
      <div class="roof"></div>
      <div class="door"></div>
      <div class="window left"></div>
      <div class="window right"></div>
    </div>
  </div>

  <div id="message" class="message"></div>

  <script>
    var house = document.getElementById('house');
    var boom = document.getElementById('boom');
    var message = document.getElementById('message');
    var ufo = document.getElementById('ufo');
    var beam = document.getElementById('beam');
    var houseBuilt = false;
    var houseAbducted = false;
    var msgTimer = null;
    var ufoBusy = false;

    function showMessage(text) {
      message.textContent = text;
      message.classList.add('show');
      if (msgTimer) clearTimeout(msgTimer);
      msgTimer = setTimeout(function () {
        message.classList.remove('show');
      }, 1500);
    }

    function spawnParticles() {
      var colors = ['#f44336', '#ff9800', '#ffeb3b', '#8d6e63', '#ffffff'];
      var rect = house.getBoundingClientRect();
      var hw = rect.left + rect.width / 2;
      var hy = rect.top + rect.height / 2;
      for (var i = 0; i < 30; i++) {
        var p = document.createElement('div');
        p.className = 'particle';
        p.style.background = colors[i % colors.length];
        p.style.left = hw + 'px';
        p.style.top = hy + 'px';
        p.style.setProperty('--dx', (Math.random() - 0.5) * 500 + 'px');
        p.style.setProperty('--dy', (-Math.random() * 500 + 100) + 'px');
        document.body.appendChild(p);
        (function (el) {
          setTimeout(function () { el.remove(); }, 900);
        })(p);
      }
    }

    function buildHouse() {
      if (houseBuilt) {
        showMessage('A casa já está construída!');
        return;
      }
      houseBuilt = true;
      houseAbducted = false;
      house.style.visibility = '';
      boom.classList.remove('show');
      house.classList.remove('built');
      void house.offsetWidth;
      house.classList.add('built');
      house.classList.add('popping');
      setTimeout(function () {
        house.classList.remove('popping');
      }, 500);
      showMessage('🏠 Casa construída');
    }

    function explodeHouse() {
      if (!houseBuilt) {
        showMessage('Não há casa para explodir!');
        return;
      }
      spawnParticles();
      boom.classList.remove('show');
      void boom.offsetWidth;
      boom.classList.add('show');
      house.classList.remove('built');
      houseBuilt = false;
      showMessage('💥 BUM!');
    }

    function spawnDrips() {
      var rect = house.getBoundingClientRect();
      var hw = rect.left + rect.width / 2;
      var hy = rect.top + rect.height / 2;
      for (var i = 0; i < 8; i++) {
        var d = document.createElement('div');
        d.className = 'drip';
        d.style.left = hw + (i - 3) * 22 + 'px';
        d.style.top = hy + 60 + (i % 3) * 15 + 'px';
        d.style.animationDelay = i * 0.15 + 's';
        document.body.appendChild(d);
        (function (el) {
          setTimeout(function () { el.remove(); }, 2600);
        })(d);
      }
    }

    function meltHouse() {
      if (!houseBuilt) {
        showMessage('Não há casa para derreter!');
        return;
      }
      spawnDrips();
      house.classList.remove('built');
      house.classList.add('melting');
      houseBuilt = false;
      showMessage('🥵 A casa derreteu');
      setTimeout(function () {
        house.classList.remove('melting');
      }, 1700);
    }

    function flyEnter(cb) {
      if (ufoBusy) return;
      ufoBusy = true;
      ufo.classList.remove('exit');
      ufo.style.left = '';
      ufo.style.top = '';
      ufo.style.visibility = '';
      ufo.classList.add('enter');
      setTimeout(function () {
        if (cb) cb();
      }, 1600);
    }

    function flyExit(cb) {
      ufo.classList.remove('enter');
      void ufo.offsetWidth;
      ufo.classList.add('exit');
      setTimeout(function () {
        ufo.classList.remove('exit');
        ufo.style.left = '-320px';
        ufo.style.top = '';
        ufo.style.visibility = 'hidden';
        ufoBusy = false;
        if (cb) cb();
      }, 1500);
    }

    function abductHouse() {
      if (!houseBuilt) {
        showMessage('Não há casa para abduzir!');
        return;
      }
      if (ufoBusy) {
        showMessage('O OVNI está ocupado!');
        return;
      }
      houseBuilt = false;
      houseAbducted = true;

      flyEnter(function () {
        beam.classList.add('show');
        house.classList.remove('built');
        house.classList.add('abducted');
      });

      setTimeout(function () {
        house.classList.remove('abducted');
        house.style.visibility = 'hidden';
        beam.classList.remove('show');
        flyExit(function () {
          house.style.visibility = '';
        });
      }, 3400);

      showMessage('🛸 Casa abduzida!');
    }

    function returnHouse() {
      if (!houseAbducted) {
        showMessage('A casa não está abduzida!');
        return;
      }
      if (ufoBusy) {
        showMessage('O OVNI está ocupado!');
        return;
      }
      houseAbducted = false;

      flyEnter(function () {
        beam.classList.add('show');
        house.classList.remove('built');
        house.style.visibility = '';
        void house.offsetWidth;
        house.classList.add('built');
        house.classList.add('returning');
      });

      setTimeout(function () {
        house.classList.remove('returning');
        houseBuilt = true;
        beam.classList.remove('show');
        showMessage('🏠 Casa devolvida!');
        flyExit();
      }, 3400);
    }
  </script>
</body>
</html>
